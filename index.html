
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Link Generator</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .generator-card {
            text-align: center;
            width: 100%;
        }

        #randomButton {
            display: block;
            margin: 25px auto;
        }

        .result {
            text-align: center;
            margin: 25px auto;
        }

        .open-button {
            display: block;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <main class="main-container">

        <header>
            <div class="logo">🍪</div>

            <h1>It's Cookie Season!</h1>

            <p class="subtitle">
                Stock up now before it's too late!
            </p>
        </header>

        <section class="generator-card">

            <button id="randomButton">
                Generate Random Storefront
            </button>

            <p id="status" aria-live="polite">
                Ready when you are!
            </p>

            <div id="result" class="result hidden">

                <h3 id="linkName"></h3>

                <a
                    id="linkURL"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer">
                </a>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
